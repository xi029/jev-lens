<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1360"
  height="500"
  viewBox="0 0 1360 500"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Add an evidence gate to your existing RAG</title>
  <desc id="desc">
    Your retriever supplies a question and excerpts to JevLens. The answer route allows your
    generator to use judged excerpts. Other routes request evidence, abstain or review conflicts.
    Decisions are saved for replay without new inference.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#8ae4b6" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="1360" height="500" rx="24" fill="#101a15" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="58" font-size="15" fill="#8ae4b6" letter-spacing="2">
      JEVLENS / INTEGRATION
    </text>
    <text x="60" y="104" font-size="34" font-weight="700" fill="#f1f5ee">
      Keep your RAG. Add an evidence decision.
    </text>
    <g fill="#1c2b23" stroke="#344c3e">
      <rect x="60" y="150" width="290" height="155" rx="16" />
      <rect x="470" y="150" width="350" height="155" rx="16" stroke="#8ae4b6" />
      <rect x="970" y="150" width="330" height="155" rx="16" />
    </g>
    <text x="85" y="185" font-size="13" fill="#a2b8a9">YOUR APPLICATION</text>
    <text x="85" y="221" font-size="24" font-weight="700" fill="#f1f5ee">Existing retriever</text>
    <text x="85" y="251" font-size="16" fill="#c1d1c5">Vector / keyword / hybrid search</text>
    <text x="85" y="278" font-size="16" fill="#c1d1c5">Question + excerpt IDs + text</text>
    <text x="495" y="185" font-size="13" fill="#8ae4b6">POST /api/decide · OR PYTHON</text>
    <text x="495" y="221" font-size="24" font-weight="700" fill="#f1f5ee">
      JevLens evidence gate
    </text>
    <text x="495" y="251" font-size="16" fill="#c1d1c5">Laya / Ollama / optional Jev</text>
    <text x="495" y="278" font-size="16" fill="#c1d1c5">Typed judgment → deterministic policy</text>
    <text x="995" y="185" font-size="13" fill="#a2b8a9">YOUR APPLICATION · ANSWER ROUTE</text>
    <text x="995" y="221" font-size="24" font-weight="700" fill="#f1f5ee">Existing generator</text>
    <text x="995" y="251" font-size="16" fill="#c1d1c5">Use the exact judged excerpts</text>
    <text x="995" y="278" font-size="16" fill="#c1d1c5">Your model, prompts and citations</text>
    <g stroke="#8ae4b6" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M350 227 H450" />
      <path d="M820 227 H950" />
      <path d="M645 305 V338" />
    </g>
    <text x="853" y="211" font-size="15" fill="#8ae4b6">answer</text>
    <rect x="395" y="350" width="900" height="58" rx="12" fill="#202b23" stroke="#344c3e" />
    <text x="420" y="385" font-size="16" fill="#d0dece">
      Other routes: retrieve_more · abstain · review_conflict → skip generator
    </text>
    <text x="60" y="457" font-size="17" fill="#8ae4b6">
      Saved trace → inspect sources · export JSON · replay thresholds with zero new inference
    </text>
  </g>
</svg>
